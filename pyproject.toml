[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ragdrift"
version = "0.1.0"
description = "5-dimensional production drift detection for RAG systems."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mukunda Katta", email = "mukunda.vjcs6@gmail.com" }]
keywords = ["rag", "drift", "monitoring", "llm", "evaluation", "observability", "embeddings"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
aws = ["boto3>=1.34"]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.urls]
Homepage = "https://github.com/MukundaKatta/ragdrift"
Issues = "https://github.com/MukundaKatta/ragdrift/issues"
Repository = "https://github.com/MukundaKatta/ragdrift"

[tool.hatch.build.targets.wheel]
packages = ["src/ragdrift"]

[tool.hatch.build.targets.sdist]
include = [
    "src/ragdrift",
    "tests",
    "examples",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "pyproject.toml",
    ".github/workflows",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
